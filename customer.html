<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal - MTEF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { margin: 0; background-color: #0b0f19; color: #fff; font-family: 'Inter', sans-serif; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #1e293b; margin-bottom: 20px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #3498db; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #3498db; background: rgba(52,152,219,0.1); }
        .user-info h2 { margin: 0; font-size: 18px; font-weight: 700; text-transform: capitalize; }
        .user-info p { margin: 4px 0 0 0; font-size: 11px; color: #2ecc71; font-weight: bold; background: rgba(46,204,113,0.1); padding: 2px 8px; border-radius: 4px; display: inline-block; letter-spacing: 1px; }
        .card { background-color: #121826; border-radius: 16px; padding: 25px; border: 1px solid #1e293b; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="avatar" id="user-avatar">CU</div>
            <div class="user-info">
                <h2 id="user-name">Loading...</h2>
                <p id="user-id">ID: MTEF@----</p>
            </div>
        </div>
        <i class="fa-solid fa-power-off" style="color:#e74c3c; font-size:24px; cursor:pointer;" onclick="logout()"></i>
    </div>

    <div class="card">
        <i class="fa-solid fa-laptop-code" style="font-size: 50px; color: #3498db; margin-bottom: 15px;"></i>
        <h3 style="margin: 0 0 10px 0;">Welcome to MTEF Services</h3>
        <p style="color: #64748b; font-size: 14px;">Aapka project abhi process me hai. Support ke liye admin se sampark karein.</p>
        <button style="background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 8px; margin-top: 15px; font-weight: bold; width: 100%; cursor: pointer;" onclick="alert('Admin WhatsApp Opening...')"><i class="fa-brands fa-whatsapp"></i> Chat with Support</button>
    </div>

    <script>
        window.onload = function() {
            const name = localStorage.getItem('userName') || "Customer User";
            const id = localStorage.getItem('userId') || "MTEF@0000";
            document.getElementById('user-avatar').innerText = name.substring(0, 2).toUpperCase();
            document.getElementById('user-name').innerText = name;
            document.getElementById('user-id').innerText = `ID: ${id}`;
        }
        function logout() { localStorage.clear(); window.location.href = "index.html"; }
    </script>
</body>
</html>
