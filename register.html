<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTEF - Registration</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    
    <style>
        body { background-color: #0b0f19; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 20px 0; }
        .box { background-color: #1a2235; padding: 30px; border-radius: 12px; width: 350px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #f5b041; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        input, select { background-color: #2a354f; color: #fff; border: 1px solid #3e4b6e; }
        button { background-color: #f5b041; color: #000; font-weight: bold; cursor: pointer; }
        .captcha-row { display: flex; align-items: center; gap: 10px; }
        .captcha-txt { background: #2a354f; padding: 10px; border-radius: 6px; color: #f5b041; font-weight: bold; min-width: 60px; text-align: center; }
        .login-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .login-link a { color: #f5b041; text-decoration: none; }
        #recaptcha-container { margin-top: 10px; display: flex; justify-content: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2>REGISTRATION</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="number" id="mobile" placeholder="Mobile Number (10 Digits)">
        
        <div id="recaptcha-container"></div>
        
        <button id="otp-btn" onclick="sendOTP()">Get OTP</button>
        <input type="text" id="otp" placeholder="Enter OTP">
        <input type="password" id="password" placeholder="Set Password">
        
        <div class="captcha-row">
            <div id="cap-txt" class="captcha-txt"></div>
            <input type="number" id="cap-ans" placeholder="Answer">
        </div>

        <select id="type">
            <option value="Customer">Customer</option>
            <option value="Agent">Agent</option>
        </select>
        
        <button onclick="register()" style="background-color: #27ae60; color: white; margin-top: 10px;">Submit Registration</button>
        <div class="login-link">Already have an account? <a href="index.html">Login</a></div>
    </div>

    <script>
        // Math Captcha Setup
        let n1 = Math.floor(Math.random() * 10) + 1;
        let n2 = Math.floor(Math.random() * 10) + 1;
        document.getElementById('cap-txt').innerText = n1 + " + " + n2;

        // Firebase Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyBPM4vMsrvPxBUcNwzNgoqDwWwL_wiHJm8",
            authDomain: "mtef-9aff8.firebaseapp.com",
            projectId: "mtef-9aff8",
            storageBucket: "mtef-9aff8.firebasestorage.app",
            messagingSenderId: "717904294402",
            appId: "1:717904294402:web:4beaaFec7966678e99ed1b"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Recaptcha Setup
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
            'size': 'invisible'
        });

        let confirmationResult = null;

        // Send OTP
        async function sendOTP() {
            const mobile = document.getElementById('mobile').value;
            if(mobile.length !== 10) return alert("Enter valid 10-digit number");
            
            const phoneNumber = "+91" + mobile; 
            const appVerifier = window.recaptchaVerifier;

            document.getElementById('otp-btn').innerText = 'Sending... Please wait';
            
            try {
                confirmationResult = await auth.signInWithPhoneNumber(phoneNumber, appVerifier);
                alert("OTP Sent Successfully by Google!");
                document.getElementById('otp-btn').innerText = 'Get OTP';
            } catch (error) {
                console.error("Firebase Error:", error);
                alert("Error: " + error.message);
                document.getElementById('otp-btn').innerText = 'Get OTP';
            }
        }

        // Verify & Register
        async function register() {
            const ans = document.getElementById('cap-ans').value;
            if(parseInt(ans) !== (n1+n2)) return alert("Wrong Math Captcha");
            
            const otp = document.getElementById('otp').value;
            if(!otp) return alert("Please enter OTP");
            if(!confirmationResult) return alert("Please request OTP first!");

            try {
                await confirmationResult.confirm(otp);
                
                const payload = {
                    fullName: document.getElementById('name').value,
                    mobile: document.getElementById('mobile').value,
                    password: document.getElementById('password').value,
                    accountType: document.getElementById('type').value
                };

                const res = await fetch('/api/register', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                alert(data.message);
                if(data.success) window.location.href = 'index.html';

            } catch (error) {
                alert("Invalid OTP! गलत OTP");
            }
        }
    </script>
</body>
</html>
