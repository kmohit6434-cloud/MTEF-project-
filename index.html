<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTEF - Login</title>
    <style>
        body { background-color: #0b0f19; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background-color: #1a2235; padding: 30px; border-radius: 12px; width: 350px; border: 1px solid #1e293b; }
        input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        input { background-color: #0b0f19; color: #fff; border: 1px solid #3e4b6e; }
        button { background-color: #f5b041; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center; color:#f5b041;">MTEF LOGIN</h2>
        <input type="text" id="email" placeholder="Mobile / Admin ID">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p style="text-align:center; font-size:14px;">No account? <a href="register.html" style="color:#f5b041;">Register</a></p>
    </div>
    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if(data.success) {
                localStorage.setItem('userEmail', email);
                if(data.isAdmin) {
                    localStorage.setItem('isAdmin', 'true');
                } else {
                    localStorage.removeItem('isAdmin');
                }
                window.location.href = data.redirectUrl;
            } else { alert(data.message); }
        }
    </script>
</body>
</html>
