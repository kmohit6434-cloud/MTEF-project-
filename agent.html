<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Portal</title>
    <style>
        body { background-color: #0b0f19; color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: #1a2235; max-width: 450px; margin: auto; padding: 25px; border-radius: 12px; border-top: 4px solid #f5b041; }
        h2 { text-align: center; color: #f5b041; }
        .section { background: #2a354f; padding: 20px; border-radius: 8px; margin-top: 20px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; }
        button { background: #f5b041; color: #000; font-weight: bold; cursor: pointer; }
        .logout { background: #e74c3c; color: #fff; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>AGENT PORTAL</h2>
        <div class="section">
            <h3>🏦 Bank Account Details</h3>
            <input type="text" id="bName" placeholder="Bank Name">
            <input type="text" id="aHolder" placeholder="Account Holder Name">
            <input type="number" id="aNum" placeholder="Account Number">
            <input type="text" id="ifsc" placeholder="IFSC Code">
            <button onclick="updateBank()">Save Bank Details</button>
        </div>
        <button class="logout" onclick="location.href='index.html'">Logout</button>
    </div>

    <script>
        async function updateBank() {
            const session = localStorage.getItem('userSession');
            const data = {
                email: session,
                bankName: document.getElementById('bName').value,
                accHolder: document.getElementById('aHolder').value,
                accNumber: document.getElementById('aNum').value,
                ifsc: document.getElementById('ifsc').value
            };
            const res = await fetch('/api/add-bank', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
        }
    </script>
</body>
</html>
