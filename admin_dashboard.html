<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - MTEF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { margin: 0; background-color: #0b0f19; color: #ffffff; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background-color: #121826; border-right: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 100; }
        .nav-menu { padding: 15px 0; flex-grow: 1; overflow-y: auto; }
        .nav-item { padding: 12px 20px; display: flex; align-items: center; gap: 15px; color: #94a3b8; cursor: pointer; font-size: 14px; }
        .nav-item.active { color: #f5b041; border-left: 3px solid #f5b041; background-color: rgba(245, 176, 65, 0.1); }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; background-color: #0b0f19; }
        .topbar { padding: 15px 30px; background-color: #121826; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; }
        .page { display: none; padding: 30px; }
        .page.active { display: block; }
        .card-panel { background-color: #121826; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #1e293b; }
        .data-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; background-color: #1a2235; border-radius: 8px; border: 1px solid #2a354f; margin-bottom:10px; }
        .btn { padding: 8px 15px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
        
        /* Modal Style for Project Update */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: #121826; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid #3498db; }
        .modal input { width: 100%; padding: 10px; margin-bottom: 10px; background: #0b0f19; color: white; border: 1px solid #1e293b; border-radius: 6px; box-sizing: border-box; }
        .modal label { font-size: 11px; color: #3498db; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div style="padding: 20px; border-bottom: 1px solid #1e293b;"><h2 style="margin:0; color:#f5b041;">MTEF ADMIN</h2></div>
        <div class="nav-menu">
            <div class="nav-item active" onclick="switchPage('dashboard')"><i class="fa-solid fa-house"></i> Dashboard</div>
            <div class="nav-item" onclick="switchPage('customers')"><i class="fa-solid fa-users"></i> Customer Mgmt</div>
            <div class="nav-item" onclick="switchPage('create-user')"><i class="fa-solid fa-user-plus"></i> Create User</div>
            <div class="nav-item" onclick="logout()"><i class="fa-solid fa-power-off"></i> Logout</div>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar"><h2 id="top-title" style="margin:0;">Dashboard Overview</h2></div>

        <div id="page-dashboard" class="page active">
            <div class="card-panel"><h3>Welcome to Super Admin Portal</h3><p>Manage all agents and customers from here.</p></div>
        </div>

        <div id="page-customers" class="page">
            <div class="card-panel">
                <h3>ALL REGISTERED CUSTOMERS</h3>
                <div id="customers-list"><p>Loading...</p></div>
            </div>
        </div>

        <div id="page-create-user" class="page">
            <div class="card-panel" style="max-width: 400px;">
                <h3 style="color:#f5b041;">Create User (No OTP)</h3>
                <select id="new-user-type" style="width:100%; padding:10px; margin-bottom:10px; background:#0b0f19; color:white;"><option value="Customer">Customer</option><option value="Agent">Agent</option></select>
                <input type="text" id="new-user-name" placeholder="Full Name" style="width:100%; padding:10px; margin-bottom:10px; background:#0b0f19; color:white;">
                <input type="number" id="new-user-mobile" placeholder="Mobile Number" style="width:100%; padding:10px; margin-bottom:10px; background:#0b0f19; color:white;">
                <input type="text" id="new-user-pass" placeholder="Password" style="width:100%; padding:10px; margin-bottom:10px; background:#0b0f19; color:white;">
                <button class="btn" style="background:#f5b041; width:100%;" onclick="adminCreateUser()">Create Account</button>
            </div>
        </div>
    </div>

    <div class="modal" id="updateModal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#3498db;">Update Client Project</h3>
            <input type="hidden" id="upd-mobile">
            <label>Project Status Text (e.g. Development Phase)</label>
            <input type="text" id="upd-status">
            <label>Progress Percentage (0-100)</label>
            <input type="number" id="upd-progress">
            <label>Advance Paid (₹)</label>
            <input type="number" id="upd-advance">
            <label>Balance Due (₹)</label>
            <input type="number" id="upd-balance">
            <label>Delivery Due Date (e.g. 15 May 2026)</label>
            <input type="text" id="upd-date">
            <label>Selected Service</label>
            <input type="text" id="upd-service">
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn" style="background:#2ecc71; color:white; flex:1;" onclick="submitUpdate()">Save Live</button>
                <button class="btn" style="background:#e74c3c; color:white; flex:1;" onclick="document.getElementById('updateModal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
        }
        function logout() { localStorage.clear(); window.location.href = "index.html"; }

        async function loadAdminData() {
            const res = await fetch('/api/admin/all-data');
            const data = await res.json();
            const customersList = document.getElementById('customers-list');
            customersList.innerHTML = '';
            
            data.customers.forEach(cust => {
                customersList.innerHTML += `
                <div class="data-row">
                    <div>
                        <h4 style="margin:0;">${cust.fullName || 'Unnamed'}</h4>
                        <p style="margin:0; font-size:12px; color:#94a3b8;">+91 ${cust.mobile} | ID: ${cust.userId}</p>
                        <p style="margin:5px 0 0 0; font-size:12px; color:#e74c3c;"><i class="fa-solid fa-key"></i> Pass: ${cust.password}</p>
                    </div>
                    <button class="btn" style="background:#3498db; color:white;" onclick="openUpdateModal('${cust.mobile}')"><i class="fa-solid fa-pen"></i> Update Project</button>
                </div>`;
            });
        }

        function openUpdateModal(mobile) {
            document.getElementById('upd-mobile').value = mobile;
            document.getElementById('updateModal').style.display = 'flex';
        }

        async function submitUpdate() {
            const payload = {
                mobile: document.getElementById('upd-mobile').value,
                statusText: document.getElementById('upd-status').value,
                progress: document.getElementById('upd-progress').value,
                advancePaid: document.getElementById('upd-advance').value,
                balanceDue: document.getElementById('upd-balance').value,
                dueDate: document.getElementById('upd-date').value,
                serviceName: document.getElementById('upd-service').value
            };
            const res = await fetch('/api/admin/update-project', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            alert(data.message);
            document.getElementById('updateModal').style.display = 'none';
        }

        async function adminCreateUser() {
            const payload = { accountType: document.getElementById('new-user-type').value, fullName: document.getElementById('new-user-name').value, mobile: document.getElementById('new-user-mobile').value, password: document.getElementById('new-user-pass').value };
            const res = await fetch('/api/admin/create-user', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            alert((await res.json()).message); loadAdminData();
        }
        loadAdminData();
    </script>
</body>
</html>
