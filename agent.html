<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Portal - MTEF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { margin: 0; background-color: #0b0f19; color: #fff; font-family: 'Inter', sans-serif; padding-bottom: 70px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background-color: #121826; border-bottom: 1px solid #1e293b; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #f5b041; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #f5b041; background: rgba(245, 176, 65, 0.1); }
        
        /* NAME AND ID STYLES */
        .agent-info h2 { margin: 0; font-size: 18px; font-weight: 700; color: #fff; text-transform: capitalize; }
        .agent-info p { margin: 4px 0 0 0; font-size: 12px; color: #3498db; letter-spacing: 1px; font-weight: bold; background: rgba(52, 152, 219, 0.1); padding: 2px 8px; border-radius: 4px; display: inline-block; }
        
        .logout-btn { color: #e74c3c; font-size: 24px; cursor: pointer; }
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        .card { background-color: #121826; border-radius: 12px; padding: 20px; border: 1px solid #1e293b; margin-bottom: 15px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background-color: #0b0f19; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #1e293b; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #64748b; font-size: 11px; font-weight: 500; cursor: pointer; }
        .nav-item.active { color: #f5b041; }
        input, button { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #1e293b; background: #0b0f19; color: white; box-sizing: border-box; }
        button { background: #f5b041; color: black; font-weight: bold; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <div class="avatar" id="user-avatar">AG</div>
            <div class="agent-info">
                <h2 id="user-name">Loading...</h2>
                <p id="user-id">ID: MTEF----</p>
            </div>
        </div>
        <i class="fa-solid fa-power-off logout-btn" onclick="logout()"></i>
    </div>

    <div id="home" class="page active">
        <div style="display: flex; gap: 15px; margin-bottom: 20px;">
            <div class="card" style="flex:1; border-left: 4px solid #2ecc71;">
                <div style="font-size:11px; color:#94a3b8; text-transform:uppercase;">Total Earnings</div>
                <div style="font-size:24px; font-weight:bold; color:#2ecc71;">₹0</div>
            </div>
            <div class="card" style="flex:1; border-left: 4px solid #3498db;">
                <div style="font-size:11px; color:#94a3b8; text-transform:uppercase;">My Leads</div>
                <div style="font-size:24px; font-weight:bold; color:#3498db;">0</div>
            </div>
        </div>
    </div>

    <div id="wallet" class="page">
        <h4 style="color:#f5b041; margin-top:0;"><i class="fa-solid fa-building-columns"></i> UPDATE BANK ACCOUNT</h4>
        <div class="card">
            <input type="text" id="bankName" placeholder="Bank Name (e.g., SBI)">
            <input type="text" id="accHolder" placeholder="Account Holder Name">
            <input type="number" id="accNumber" placeholder="Account Number">
            <input type="text" id="ifsc" placeholder="IFSC Code">
            <button onclick="saveBankDetails()">Save Details</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')" id="nav-home"><i class="fa-solid fa-house" style="font-size:18px;"></i>Home</div>
        <div class="nav-item" onclick="switchTab('wallet')" id="nav-wallet"><i class="fa-solid fa-wallet" style="font-size:18px;"></i>Wallet</div>
    </div>

    <script>
        // 🛑 ON PAGE LOAD: JAISE HI PORTAL KHULEGA NAAM AUR ID SET HO JAYEGI 🛑
        window.onload = function() {
            const name = localStorage.getItem('userName') || "Agent Partner";
            const id = localStorage.getItem('userId') || "MTEFXXXX";
            
            // Avatar me naam ke pehle 2 akshar
            document.getElementById('user-avatar').innerText = name.substring(0, 2).toUpperCase();
            
            // Naam aur ID print karo
            document.getElementById('user-name').innerText = name;
            document.getElementById('user-id').innerText = `ID: ${id}`;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
        }

        async function saveBankDetails() {
            const payload = {
                email: localStorage.getItem('userEmail'),
                bankName: document.getElementById('bankName').value,
                accHolder: document.getElementById('accHolder').value,
                accNumber: document.getElementById('accNumber').value,
                ifsc: document.getElementById('ifsc').value
            };
            if(!payload.bankName || !payload.accNumber) return alert("Fill required details!");

            const res = await fetch('/api/add-bank', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            alert(data.message);
        }

        function logout() { localStorage.clear(); window.location.href = "index.html"; }
    </script>
</body>
</html>
