<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body { background-color: #0b0f19; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background-color: #1a2235; padding: 30px; border-radius: 10px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #ff4757; margin-top: 0; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; font-size: 14px;}
        input { background-color: #2a354f; color: #fff; outline: none;}
        button { background-color: #ff4757; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #ff6b81; }
        .links { margin-top: 15px; font-size: 14px; }
        .links a { color: #aaa; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Admin Login</h2>
        <input type="text" id="email" placeholder="Admin Email ID">
        <input type="password" id="password" placeholder="Admin Password">
        <button onclick="adminLogin()">Login to Dashboard</button>
        <div class="links">
            <a href="index.html">← Back to Registration</a>
        </div>
    </div>

    <script>
        async function adminLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password) return alert("Email और Password डालें!");

            const res = await fetch('/api/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            
            if(data.success && data.redirectUrl === 'admin.html') {
                alert("Welcome Admin!");
                // Here you would redirect to the actual dashboard page
            } else {
                alert("गलत Admin Credentials!");
            }
        }
    </script>
</body>
</html>
