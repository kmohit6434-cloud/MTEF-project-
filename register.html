<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTEF - Registration</title>
    <style>
        body { background-color: #0b0f19; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background-color: #1a2235; padding: 30px; border-radius: 12px; width: 350px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #f5b041; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        input, select { background-color: #2a354f; color: #fff; border: 1px solid #3e4b6e; }
        button { background-color: #f5b041; color: #000; font-weight: bold; cursor: pointer; }
        .login-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .login-link a { color: #f5b041; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>REGISTRATION</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="number" id="mobile" placeholder="WhatsApp Number (10 Digits)">
        
        <button id="otp-btn" onclick="sendOTP()">Get WhatsApp OTP</button>
        <input type="text" id="otp" placeholder="Enter OTP">
        <input type="password" id="password" placeholder="Set Password">
        
        <select id="type">
            <option value="Customer">Customer</option>
            <option value="Agent">Agent</option>
        </select>
        
        <button onclick="register()" style="background-color: #27ae60; color: white; margin-top: 10px;">Submit Registration</button>
        <div class="login-link">Already have an account? <a href="index.html">Login</a></div>
    </div>

    <script>
        async function sendOTP() {
            const mobile = document.getElementById('mobile').value;
            if(mobile.length !== 10) return alert("Enter valid 10-digit number");
            
            document.getElementById('otp-btn').innerText = 'Sending...';
            const res = await fetch('/api/send-otp', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ mobile })
            });
            const data = await res.json();
            alert(data.message);
            document.getElementById('otp-btn').innerText = 'Get WhatsApp OTP';
        }

        async function register() {
            const payload = {
                fullName: document.getElementById('name').value,
                mobile: document.getElementById('mobile').value,
                otp: document.getElementById('otp').value,
                password: document.getElementById('password').value,
                accountType: document.getElementById('type').value
            };

            if(!payload.otp) return alert("Please enter OTP");

            const res = await fetch('/api/register', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            alert(data.message);
            if(data.success) window.location.href = 'index.html';
        }
    </script>
</body>
</html>
